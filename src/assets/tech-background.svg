<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Minimal technology desk background</title>
  <desc id="desc">A soft desktop scene with a mouse, laptop, and phone on a reflective surface.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e6e8e5"/>
      <stop offset="0.55" stop-color="#d8ddd3"/>
      <stop offset="1" stop-color="#aeb8c1"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfd5d3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7e8a9e" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eef1ec"/>
      <stop offset="0.55" stop-color="#aab2bd"/>
      <stop offset="1" stop-color="#eef0eb"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect y="670" width="1920" height="410" fill="url(#surface)"/>
  <ellipse cx="960" cy="690" rx="770" ry="44" fill="#f1f3e9" opacity="0.48" filter="url(#blur)"/>
  <g opacity="0.92">
