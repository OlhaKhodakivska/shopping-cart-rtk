    <circle cx="952" cy="732" r="16" fill="#f1f2ea" opacity="0.9"/>
    <ellipse cx="981" cy="734" rx="18" ry="6" fill="#f1f2ea" opacity="0.78"/>
  </g>
  <g opacity="0.9">
