    <path d="M62 768c21-64 102-92 235-67 48 9 78 30 96 58-74 14-258 18-331 9z" fill="url(#metal)"/>
    <path d="M68 770c71 14 247 11 322-8" fill="none" stroke="#6a7088" stroke-width="5" opacity="0.45"/>
  </g>
  <g>
    <ellipse cx="965" cy="820" rx="430" ry="36" fill="#344057" opacity="0.28" filter="url(#blur)"/>
    <path d="M548 705h670c47 0 112 49 161 91H627c-66 0-92-43-79-91z" fill="#596073"/>
    <path d="M548 705h670c47 0 112 49 161 91H627c-66 0-92-43-79-91z" fill="url(#metal)" opacity="0.84"/>
    <path d="M626 796h753c-12 22-39 34-82 34H642c-39 0-62-12-69-34z" fill="#2f3748"/>
    <rect x="595" y="776" width="88" height="16" rx="3" fill="#6c7588"/>
    <rect x="704" y="776" width="56" height="16" rx="3" fill="#31384b"/>
